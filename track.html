<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YAS | تتبع طلبك</title><link rel="stylesheet" href="assets/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="app-shell">
  <main class="main full-width">
    <header class="topbar"><div><div class="eyebrow">YAS</div><h1>تتبع طلبك</h1></div></header>
    <section class="view active" style="max-width:600px;margin:2rem auto;">
      <div class="tracking-hero"><div class="eyebrow">ORDER TRACKING</div><h2>طلبك فين دلوقتي؟</h2><p>اكتب رقم الطلب ورقم الهاتف المسجل عشان تتابع حالة التوصيل.</p></div>
      <form id="tracking-form" class="tracking-search panel"><label>رقم الطلب<input id="order-input" name="orderId" required placeholder="YAS-20261010-001"></label><label>رقم الهاتف<input id="phone-input" name="phone" required inputmode="tel" placeholder="رقم الهاتف المسجل"></label><button class="btn primary" type="submit">تتبع الطلب ←</button></form>
      <div id="tracking-result" class="tracking-result hidden"></div>
      <div class="public-hint">للتجربة: استخدم البيانات الموجودة في صفحة السليز.</div>
    </section>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <script src="assets/js/supabase-config.js"></script>
  <script src="assets/js/app-track.js"></script>
</body></html>
