<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YAS | تتبع طلبك</title><link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="app-shell">
  <main class="main full-width">
    <header class="topbar"><div><div class="eyebrow">YAS</div><h1>تتبع طلبك</h1></div></header>
    <section class="view active" style="max-width:600px;margin:2rem auto;">
      <div class="tracking-hero"><div class="eyebrow">ORDER TRACKING</div><h2>طلبك فين دلوقتي؟</h2><p>اكتب رقم الطلب ورقم الهاتف المسجل عشان تتابع حالة التوصيل.</p></div>
      <form id="tracking-form" class="tracking-search panel"><label>رقم الطلب<input id="order-input" name="orderId" required placeholder="YAS-1" pattern="YAS-[0-9]+" title="رقم الطلب بالشكل: YAS-1"></label><label>رقم الهاتف<input id="phone-input" name="phone" required inputmode="tel" placeholder="رقم الهاتف المسجل" pattern="01[0-9]{9}" title="رقم الهاتف يجب أن يبدأ بـ 01 ويكون 11 رقم"></label><button class="btn primary" type="submit">تتبع الطلب ←</button></form>
      <div id="tracking-result" class="tracking-result hidden"></div>
      <div id="customer-notes-section" class="panel hidden" style="margin-top: 20px;"><div class="section-title"><h3>ملاحظات العميل</h3><p>اكتب أي ملاحظات أو طلبات إضافية</p></div><textarea id="customer-notes" rows="3" placeholder="اكتب ملاحظاتك هنا..." style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-family:inherit;"></textarea><button class="btn primary" onclick="saveCustomerNotes()" style="margin-top:10px;">إرسال الملاحظات</button></div>
    </section>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <script src="supabase-config.js"></script>
  <script src="app-track.js"></script>
</body></html>
