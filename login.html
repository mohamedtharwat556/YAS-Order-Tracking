<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YAS | تسجيل الدخول</title><link rel="stylesheet" href="style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }
    .video-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }
    .video-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: -1;
    }
    .login-container {
      max-width: 500px;
      width: 100%;
      padding: 2rem;
      position: relative;
      z-index: 1;
      margin-right: 10%;
    }
    .login-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      padding: 3rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .login-header {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    .login-header h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }
    .form-layout label {
      margin-bottom: 1.5rem;
    }
    .form-layout input {
      padding: 12px;
      font-size: 16px;
    }
    .btn {
      padding: 14px;
      font-size: 16px;
    }
  </style>
</head>
<body class="app-shell">
  <video class="video-background" autoplay muted loop playsinline>
    <source src="Sales_team_working_in_showroom_20261012093142.mp4" type="video/mp4">
  </video>
  <div class="video-overlay"></div>
  <main class="main full-width" style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
    <div style="position: fixed; top: 20px; left: 20px; z-index: 1000;">
      <button class="icon-btn" id="dark-mode-toggle" title="الوضع الليلي">🌙</button>
    </div>
    <div class="login-container">
      <div class="login-card">
        <div class="login-header">
          <h1>YAS Sales</h1>
          <p class="muted">تسجيل دخول المبيعات</p>
        </div>
        <form id="login-form" class="form-layout">
          <label>البريد الإلكتروني <input name="email" type="email" required placeholder="email@example.com" pattern="[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$"></label>
          <label>كلمة المرور <input name="password" type="password" required placeholder="••••••••" minlength="6"></label>
          <button class="btn primary full-width" type="submit">تسجيل الدخول</button>
        </form>
      </div>
    </div>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <script>
    // Dark mode toggle
    const darkModeToggle = document.getElementById('dark-mode-toggle');
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
      document.body.classList.add('dark-mode');
    }
    darkModeToggle.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });

    const salesUser = { email: 'sales@yas.com', password: 'sales123', redirect: 'index.html', name: 'المبيعات' };

    function toast(message) {
      const el = document.getElementById('toast');
      el.textContent = message;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2600);
    }

    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const form = e.target;
      const data = Object.fromEntries(new FormData(form).entries());

      if (data.email === salesUser.email && data.password === salesUser.password) {
        localStorage.setItem('yas_auth', JSON.stringify({ role: 'sales', email: data.email, name: salesUser.name }));
        window.location.href = salesUser.redirect;
      } else {
        toast('البريد الإلكتروني أو كلمة المرور غير صحيحة');
      }
    });

    // Check if already logged in
    const auth = localStorage.getItem('yas_auth');
    if (auth) {
      const { role } = JSON.parse(auth);
      if (role === 'sales') {
        window.location.href = 'index.html';
      }
    }
  </script>
</body>
</html>
